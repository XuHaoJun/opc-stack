name: ${COMPOSE_PROJECT_NAME:-opc}

services:
  # ══════════════════════════ Buzz ══════════════════════════
  buzz-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${BUZZ_DB_PASSWORD:?set in .env}
      POSTGRES_DB: buzz
    volumes:
      - buzz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 5s
      retries: 30

  buzz-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${BUZZ_REDIS_PASSWORD:?set in .env}"]
    volumes:
      - buzz-redisdata:/data

  buzz-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY:?set in .env}
    volumes:
      - buzz-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  buzz-minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      buzz-minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://buzz-minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET:-buzz-media}"
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set in .env}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set in .env}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}

  # Shared nix seed — builds opc/nix-seed:local (Task 1). One-shot: image is
  # consumed via COPY --from by the service Dockerfiles; the container itself
  # does nothing.
  nix-seed:
    build:
      context: ./patches/nix-seed
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-opc}/nix-seed:local
    restart: "no"
    command: ["true"]

  # The stack's single multi-user nix-daemon (same image, long-running role).
  # Nix assumes one daemon per store and there is now exactly one store — the
  # shared `opc-nix` volume — so this service owns it: seeding, system-profile
  # self-heal, the group-writable shared agent profile, and the nix-add /
  # nix-rm / nix-list wrappers (see patches/nix-seed/opc-nix-daemon.sh).
  #
  # Every other container just mounts opc-nix and finds the socket on it: a
  # unix socket on a shared volume is reachable across containers, which is
  # what lets ONE daemon serve all of them. Agents therefore install as their
  # unprivileged runtime user (previously impossible — nix was single-user, so
  # only root could write the store).
  #
  # Losing this service degrades gracefully: already-installed tools keep
  # working (PATH points at store paths), only new installs fail.
  nix-daemon:
    image: ${IMAGE_PREFIX:-opc}/nix-seed:local
    restart: unless-stopped
    depends_on:
      nix-seed:
        condition: service_completed_successfully
    command: ["/usr/local/bin/opc-nix-daemon.sh"]
    volumes:
      - opc-nix:/nix
    healthcheck:
      test: ["CMD-SHELL", "test -S /nix/var/nix/daemon-socket/socket"]
      interval: 5s
      timeout: 3s
      retries: 60
      # First boot copies the seed into an empty volume before the socket
      # appears; that is minutes on a cold disk, not seconds.
      start_period: 300s

  # Mirrors declared host config sources into a named volume on every `up`
  # (generic host-config-sync mechanism; see docs/superpowers/specs/
  # 2026-08-17-host-config-sync-design.md). This instance syncs GitHub
  # credentials (~/.ssh + ~/.config/gh + ~/.gitconfig) into opc-gh-creds, so
  # `docker compose down -v` + `up -d` never leaves /creds empty (entrypoints
  # point git/ssh/gh at /creds via env — an empty volume silently breaks git
  # push / gh auth). Same worker as scripts/host-sync.sh; scripts/
  # sync-gh-creds.sh stays for manual refresh after host credential changes
  # (it also re-keyscans github.com, which this container-side path cannot).
  # Host sources must exist — a missing bind source fails `up` loudly rather
  # than syncing partial creds.
  host-sync:
    image: alpine:3.20
    restart: "no"
    entrypoint: ["sh", "/worker.sh"]
    environment:
      HOST_SYNC_SOURCES: "ssh gh gitconfig"
    volumes:
      - opc-gh-creds:/dst
      - ${HOME}/.ssh:/src/ssh:ro
      - ${HOME}/.config/gh:/src/gh:ro
      - ${HOME}/.gitconfig:/src/gitconfig:ro
      - ./scripts/host-sync-worker.sh:/worker.sh:ro
      - ./scripts/hooks/ssh.sh:/hooks/ssh.sh:ro
      - ./scripts/hooks/gitconfig.sh:/hooks/gitconfig.sh:ro

  # Second host-sync instance: mirrors ONLY ~/.claude/.credentials.json into
  # the prototyper agent's home volume, so paperclip's claude_local adapter
  # can use the host's Claude subscription. Deliberately NOT ~/.claude
  # wholesale — settings.json (host hooks), plugins/, skills/, projects/ and
  # history stay on the host so the container's Claude is clean (see
  # scripts/hooks/claude-cred.sh). Unlike the gh instance this one is
  # non-fatal: no Claude login just means claude_local is unavailable, and
  # omp (the primary engine) is unaffected.
  #
  # The source path is a variable (CLAUDE_CREDENTIALS_FILE) purely so a SECOND
  # stack on this host can be pointed away from it. The OAuth refresh token in
  # that file is single-use — whichever container refreshes it invalidates
  # every other copy, host included — so two stacks holding it is two chances
  # to log the human out. tests/fresh-install.sh therefore binds an
  # empty throwaway file: the hook treats empty as "no Claude login", WARNs,
  # and exits 0.
  host-sync-claude:
    image: alpine:3.20
    restart: "no"
    entrypoint: ["sh", "/worker.sh"]
    environment:
      HOST_SYNC_SOURCES: "claude-cred"
    volumes:
      - opc-prototyper-home:/dst
      - ${CLAUDE_CREDENTIALS_FILE:-${HOME}/.claude/.credentials.json}:/src/claude-cred:ro
      - ./scripts/host-sync-worker.sh:/worker.sh:ro
      - ./scripts/hooks/claude-cred.sh:/hooks/claude-cred.sh:ro

  # Generates relay/owner + front-door agent Nostr keys into the shared
  # opc-keys volume (idempotent, one-shot).
  buzz-keys:
    build:
      context: ./upstream/buzz
      dockerfile: opc/Dockerfile
      target: opc-relay
      # nix-seed is this image's BASE (`FROM ${NIX_SEED_IMAGE} AS nix-seed`),
      # and `depends_on` orders container START, not builds — compose hands the
      # whole set to buildx bake as one parallel graph, so on a clean machine
      # this FROM resolves before the nix-seed service has produced the image,
      # falls through to the registry and dies with "pull access denied for
      # <prefix>/nix-seed". Same edge, same fix as hermes' buzz-cli below: a
      # named build context IS the dependency, and it shadows the same-named
      # Dockerfile stage, so a manual `docker build` still works off the ARG.
      additional_contexts:
        nix-seed: "service:nix-seed"
      args:
        NIX_SEED_IMAGE: ${IMAGE_PREFIX:-opc}/nix-seed:local
    image: ${IMAGE_PREFIX:-opc}/buzz:local
    restart: "no"
    depends_on:
      nix-seed:
        condition: service_completed_successfully
    command: ["/usr/local/bin/opc-generate-keys.sh"]
    volumes:
      - opc-keys:/keys

  buzz:
    build:
      context: ./upstream/buzz
      dockerfile: opc/Dockerfile
      target: opc-relay
      # Build-order edge for the nix seed — see buzz-keys above for why the
      # `depends_on` is not one.
      additional_contexts:
        nix-seed: "service:nix-seed"
      args:
        NIX_SEED_IMAGE: ${IMAGE_PREFIX:-opc}/nix-seed:local
    image: ${IMAGE_PREFIX:-opc}/buzz:local
    init: true
    restart: unless-stopped
    depends_on:
      nix-daemon:
        condition: service_healthy
      buzz-db:
        condition: service_healthy
      buzz-redis:
        condition: service_started
      buzz-minio:
        condition: service_healthy
      buzz-minio-init:
        condition: service_completed_successfully
      buzz-keys:
        condition: service_completed_successfully
      nix-seed:
        condition: service_completed_successfully
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_KEYS_DIR: /keys
      DATABASE_URL: postgres://buzz:${BUZZ_DB_PASSWORD}@buzz-db:5432/buzz
      REDIS_URL: redis://:${BUZZ_REDIS_PASSWORD}@buzz-redis:6379
      RELAY_URL: ${BUZZ_RELAY_URL:-ws://localhost:3000}
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_SERVE_GIT_WEB_GUI: "true"
      BUZZ_S3_ENDPOINT: http://buzz-minio:9000
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_S3_REGION: us-east-1
      BUZZ_S3_ADDRESSING_STYLE: path
      # A3 gate: 32 concurrent conditional PUTs to one object hang MinIO on a
      # fresh volume; 8 keeps the conformance check without the stall.
      BUZZ_GIT_PROBE_WRITERS: "8"
      BUZZ_GIT_REPO_PATH: /data/git/repos
      RUST_LOG: buzz_relay=info
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
    ports:
      - "${BUZZ_PORT:-3000}:3000"
    volumes:
      - buzz-git:/data/git
      - opc-nix:/nix
      - buzz-mise:/opt/mise
      - opc-keys:/keys:ro
      - buzz-omp:/root/.omp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/_readiness"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s

  # Grants the front-door agent pubkey relay membership (idempotent, one-shot).
  buzz-bootstrap:
    image: ${IMAGE_PREFIX:-opc}/buzz:local
    restart: "no"
    command: ["/usr/local/bin/opc-add-member.sh"]
    depends_on:
      buzz:
        condition: service_healthy
    environment:
      KEYS_DIR: /keys
      BUZZ_RELAY_URL: ${BUZZ_RELAY_URL:-ws://localhost:3000}
      DATABASE_URL: postgres://buzz:${BUZZ_DB_PASSWORD}@buzz-db:5432/buzz
      REDIS_URL: redis://:${BUZZ_REDIS_PASSWORD}@buzz-redis:6379
      BUZZ_S3_ENDPOINT: http://buzz-minio:9000
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_S3_REGION: us-east-1
      BUZZ_S3_ADDRESSING_STYLE: path
    volumes:
      - opc-keys:/keys:ro
      - frontdoor-omp:/root/.omp

  # Buzz front door: buzz-acp spawning `hermes acp` (PRD Decision D topology).
  frontdoor:
    build:
      context: ./upstream/buzz
      dockerfile: opc/Dockerfile
      # Build-order edge for the nix seed — see buzz-keys above for why the
      # `depends_on` is not one.
      additional_contexts:
        nix-seed: "service:nix-seed"
      args:
        NIX_SEED_IMAGE: ${IMAGE_PREFIX:-opc}/nix-seed:local
    # ACP sidecar of the relay: shares its network namespace so the canonical
    # relay host (localhost:3000) resolves to the relay itself.
    network_mode: service:buzz
    image: ${IMAGE_PREFIX:-opc}/frontdoor:local
    init: true
    restart: unless-stopped
    depends_on:
      nix-daemon:
        condition: service_healthy
      buzz:
        condition: service_healthy
      buzz-bootstrap:
        condition: service_completed_successfully
      nix-seed:
        condition: service_completed_successfully
      # Credentials for the agent's GitHub dev flow (git push / gh): the
      # host-sync one-shot mirrors host ~/.ssh + ~/.config/gh +
      # ~/.gitconfig into opc-gh-creds (/creds) on every up.
      host-sync:
        condition: service_completed_successfully
      # Key producers: paperclip-bootstrap writes /keys/paperclip-api.key and
      # tencentdb-bootstrap writes /keys/tencentdb-admin-user-id. Without
      # these, the entrypoint's key check races the one-shots on a fresh
      # `down -v` boot and the agent silently runs with empty PAPERCLIP_API_KEY
      # (paperclip skill → 403 "Board access required").
      paperclip-bootstrap:
        condition: service_completed_successfully
      tencentdb-bootstrap:
        condition: service_completed_successfully
    environment:
      BUZZ_KEYS_DIR: /keys
      BUZZ_RELAY_URL: ${BUZZ_RELAY_URL:-ws://localhost:3000}
      # Setpriv wrapper (patches/buzz/opc-hermes-acp.sh): buzz-acp spawns the
      # agent as root, the wrapper drops it to the hermes runtime uid (10000)
      # so the shared frontdoor-hermes home stays single-owner — a root-owned
      # state.db is read-only for hermes-dashboard ("TUI session store
      # unavailable" spam) and SQLite WAL can't be shared across two unix
      # users. Basename keeps buzz-acp's harness identity "hermes".
      BUZZ_ACP_AGENT_COMMAND: /usr/local/libexec/hermes
      BUZZ_ACP_AGENT_ARGS: acp
      BUZZ_ACP_RESPOND_TO: anyone
      # Respond to every stream message in its channels (no @mention needed):
      # the desktop's mention autocomplete labels relay agents "not in channel"
      # even when they are members, which blocks mention-tag insertion.
      BUZZ_ACP_NO_MENTION_FILTER: "true"
      # Publish encrypted ACP observer frames over the relay. Without this the
      # Buzz desktop shows the agent as "working" (typing indicators) but its
      # ACP activity panel stays "No ACP activity yet" — the live transcript
      # is fed by these frames, and buzz-acp defaults relay_observer=false.
      BUZZ_ACP_RELAY_OBSERVER: "true"
      # Recipient of those frames: the owner's pubkey (set in .env — the
      # human who owns the agent, per the relay's agent_owner_pubkey). The
      # desktop must sign in with this key to decrypt. Entrypoint falls back
      # to /keys/relay.pub when unset.
      BUZZ_ACP_AGENT_OWNER: ${BUZZ_ACP_AGENT_OWNER:-}
      # NIP-OA owner attestation: lets the desktop verify this relay agent is
      # owned by the current human and ingest its owner-scoped ACP frames.
      # Contains only a public signature; the owner's private key is never
      # passed into the stack.
      BUZZ_AUTH_TAG: ${BUZZ_AUTH_TAG:-}
      # Expose the ACP agent's chain-of-thought: buzz-acp only debug-logs
      # `agent_thought_chunk` updates (target `acp::thought`) and never relays
      # them, so the default `buzz_acp=info` filter hides thinking. The
      # frontdoor entrypoint tees this output into /opt/data/logs/agent.log,
      # which the hermes dashboard Logs page reads — thinking shows up live at
      # http://localhost:9119 (Logs → agent). Override via FRONTDOOR_RUST_LOG.
      RUST_LOG: ${FRONTDOOR_RUST_LOG:-buzz_acp=info,acp::thought=debug}
      HERMES_HOME: /opt/data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENAI_MODEL: ${BUZZ_AGENT_MODEL:-deepseek-v4-pro}
      # Agent model: deepseek-v4-flash degenerates (garbage output) with
      # hermes's long system prompt on the OpenCode Go endpoint — verified by
      # replaying hermes's exact request. Default deepseek-v4-pro (reliable):
      # follows the skills index (paperclip-api assign/PR flow works), clean
      # stream termination. gpt-5.6-luna is the cheaper alternative but
      # intermittently returns empty streams (hermes EmptyStreamError) and
      # skips the skills index — the paperclip flow fails with it. Override
      # via BUZZ_AGENT_MODEL in .env.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # TencentDB Knowledge Plane (PRD v10.1): memory_tencentdb provider
      # connects to the containerized MemoryCore gateway; the Buzz front-door
      # agent scopes its memories under team=opc / agent=agt-hermes-front-door
      # (agt- prefix required by the Memory Hub panel's asset-id parsing).
      # user_id comes from /keys/tencentdb-admin-user-id (written by the
      # tencentdb-bootstrap one-shot) so the panel can render L0/L1.
      MEMORY_TENCENTDB_GATEWAY_HOST: tencentdb-core
      MEMORY_TENCENTDB_GATEWAY_PORT: "8420"
      MEMORY_TENCENTDB_GATEWAY_API_KEY: ${TENCENTDB_GATEWAY_API_KEY:-}
      MEMORY_TENCENTDB_TEAM_ID: opc
      MEMORY_TENCENTDB_AGENT_ID: agt-hermes-front-door
      # Paperclip work-plane integration (GitHub dev flow): REST base only —
      # the board API key is injected by the entrypoint from
      # /keys/paperclip-api.key (paperclip-bootstrap writes it); no .env var.
      PAPERCLIP_API_URL: http://paperclip:3100
      # Public board address, for building clickable ticket links in chat.
      # PAPERCLIP_API_URL is the internal name and is useless to a browser.
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}
    volumes:
      - frontdoor-hermes:/opt/data
      - opc-nix:/nix
      - frontdoor-mise:/opt/mise
      - opc-keys:/keys:ro
      - opc-gh-creds:/creds

  # ══════════════════════════ Hermes ══════════════════════════
  hermes:
    build:
      context: ./upstream/hermes
      dockerfile: opc/Dockerfile
      # Build-time dependency on ANOTHER service's image. The Dockerfile pulls
      # the buzz CLI out of the frontdoor image (`COPY --from=buzz-cli`), and
      # that image only exists once compose has built the `frontdoor` service.
      # `depends_on` does NOT create that edge — it orders containers at `up`,
      # while `docker compose build hermes` builds exactly one service and
      # would try to PULL ${IMAGE_PREFIX}/frontdoor:local from a registry it
      # was never pushed to. On a clean clone that is a hard failure, which
      # breaks the open-box condition (clone -> scripts/setup.sh -> working
      # stack, no manual steps).
      #
      # `service:frontdoor` as a named build context is the edge: compose
      # builds frontdoor first and hands its image to this build under the
      # name `buzz-cli`. A BuildKit named context takes precedence over a
      # same-named Dockerfile stage, so the `FROM ${BUZZ_IMAGE} AS buzz-cli`
      # stage stays as the fallback for a manual `docker build` (the path
      # AGENTS.md documents) while compose overrides it with the image it
      # just built. Both entry points therefore work, and neither needs the
      # image to pre-exist.
      additional_contexts:
        buzz-cli: "service:frontdoor"
        # Same edge for the nix seed: `FROM ${NIX_SEED_IMAGE} AS nix-seed` needs
        # an image that only the nix-seed service produces, and only a named
        # context makes compose build it first.
        nix-seed: "service:nix-seed"
      args:
        NIX_SEED_IMAGE: ${IMAGE_PREFIX:-opc}/nix-seed:local
        BUZZ_IMAGE: ${IMAGE_PREFIX:-opc}/frontdoor:local
    image: ${IMAGE_PREFIX:-opc}/hermes:local
    restart: unless-stopped
    depends_on:
      nix-daemon:
        condition: service_healthy
      nix-seed:
        condition: service_completed_successfully
      # GitHub credentials for the gateway's paperclip/gh dev flow (same
      # rationale as frontdoor).
      host-sync:
        condition: service_completed_successfully
      # Key producers (same race as frontdoor): the gateway's paperclip skill
      # needs PAPERCLIP_API_KEY; memory writes need tencentdb-admin-user-id.
      paperclip-bootstrap:
        condition: service_completed_successfully
      tencentdb-bootstrap:
        condition: service_completed_successfully
      # /keys/scientist.nsec is written by this one-shot. Without the edge,
      # a fresh boot can start the gateway first and the expert profile ends
      # up with no Buzz identity — and the symptom is not an error: buzz
      # reports "no buzz identity" and quietly does not send, which reads as
      # a relay problem rather than a missing credential.
      buzz-keys:
        condition: service_completed_successfully
      devenv-expert-leases:
        condition: service_completed_successfully
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      HERMES_HOME: /opt/data
      # Dashboard disabled: the web UI is served by the dedicated
      # `hermes-dashboard` service over the Buzz front door's home (the
      # gateway's own home has no conversations). API server (8642) stays.
      HERMES_DASHBOARD: "0"
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?set in .env}
      # Expert agent profiles served by this one gateway process. Measured
      # tradeoff (see the spec's §4.6): a container per expert costs ~118MB
      # each because the Python heap is private per process, while multiplex
      # is ~148MB fixed + ~9MB per profile. At 25 experts that is 2.95GB vs
      # 373MB. Reversible per profile: upstream's container_boot reconciler
      # gives any single profile its own supervised process when multiplex is
      # off for it, with no data move.
      GATEWAY_MULTIPLEX_PROFILES: "1"
      # Seeded into the scientist profile's own .env by the entrypoint; the
      # process-wide API_SERVER_KEY above only authorizes the default profile.
      HERMES_SCIENTIST_API_KEY: ${HERMES_SCIENTIST_API_KEY:?set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # TencentDB Knowledge Plane (PRD v10.1): memory_tencentdb provider
      # connects to the containerized MemoryCore gateway; team=opc, agent_id
      # falls back to the active hermes profile (agent_identity glue), user_id
      # from /keys/tencentdb-admin-user-id like the frontdoor.
      MEMORY_TENCENTDB_GATEWAY_HOST: tencentdb-core
      MEMORY_TENCENTDB_GATEWAY_PORT: "8420"
      MEMORY_TENCENTDB_GATEWAY_API_KEY: ${TENCENTDB_GATEWAY_API_KEY:-}
      MEMORY_TENCENTDB_TEAM_ID: opc
      # Paperclip work-plane integration (GitHub dev flow): REST base only —
      # board API key comes from /keys/paperclip-api.key via the entrypoint.
      PAPERCLIP_API_URL: http://paperclip:3100
      # Public board address, for building clickable ticket links in chat.
      # PAPERCLIP_API_URL is the internal name and is useless to a browser.
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}
      # Expert agents post their findings to Buzz with the CLI.
      #
      # Same default as buzz / buzz-bootstrap / frontdoor on purpose: one
      # canonical host string, one community (invariant 1). The relay verifies
      # NIP-42/98 signatures against the host it was addressed by, so a
      # container-local rewrite (`ws://buzz:3000`) is not a convenience — it
      # produces signatures the relay does not consider canonical, and the
      # rejection is silent.
      #
      # Note the default is not usable HERE: unlike frontdoor, this container
      # does not share buzz's network namespace, so ws://localhost:3000 points
      # at itself. Expert agents therefore require BUZZ_RELAY_URL in .env to
      # be a routable address (LAN/tailnet IP) — which invariant 1 wants
      # anyway, since that same string is what desktop clients connect to.
      # .env.example and scripts/setup.sh say so at the point you set it.
      BUZZ_RELAY_URL: ${BUZZ_RELAY_URL:-ws://localhost:3000}
    ports:
      - "${HERMES_API_PORT:-8642}:8642"
    volumes:
      - hermes-data:/opt/data
      - hermes-profiles:/opt/data/profiles
      - opc-nix:/nix
      - hermes-mise:/opt/mise
      - hermes-omp:/root/.omp
      - opc-keys:/keys:ro
      - opc-gh-creds:/creds
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8642/); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ] || [ \"$$code\" = \"403\" ] || [ \"$$code\" = \"404\" ]"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  # Dashboard over the Buzz front door's HERMES_HOME (frontdoor-hermes
  # volume). The conversations the user has via Buzz run in the ACP agents
  # spawned by `frontdoor`; the standalone `hermes` gateway keeps its own
  # empty home. This dashboard-only container (no gateway supervisor → it
  # never picks up pending agent work) serves Sessions / Logs / Chat
  # against that shared home at http://localhost:9119. Logs page shows the
  # agent's live activity incl. chain-of-thought (frontdoor tees buzz-acp
  # output into /opt/data/logs/agent.log; see RUST_LOG on frontdoor).
  hermes-dashboard:
    image: ${IMAGE_PREFIX:-opc}/hermes:local
    restart: unless-stopped
    # argv[0] MUST be `dashboard`: container_boot._is_dashboard_container()
    # reads /proc/1/cmdline to decide whether to skip per-profile gateway
    # reconciliation. With the old `sleep infinity` it is not detected, and
    # once profiles exist on the shared volume both this container and the
    # gateway flock() logs/gateways/<profile>/lock — "Resource busy" plus an
    # s6-log restart storm. Upstream deliberately keys this off argv rather
    # than an operator flag, because a forgotten flag reintroduces the storm.
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]
    depends_on:
      nix-daemon:
        condition: service_healthy
      host-sync:
        condition: service_completed_successfully
      # Same three key producers the gateway waits for, for the same reason:
      # this container runs the SAME entrypoint, whose wait_for_keys blocks
      # ~180s on /keys/paperclip-api.key, /keys/tencentdb-admin-user-id and
      # /keys/scientist.nsec. Without these edges a clean boot spends that
      # wait on every restart until all three land — and before wait_for_keys
      # was made non-fatal it was a ~180s crash-loop, not just a wait. The
      # dashboard reads the first two for its /chat PTY; it never writes any
      # of them.
      buzz-keys:
        condition: service_completed_successfully
      paperclip-bootstrap:
        condition: service_completed_successfully
      tencentdb-bootstrap:
        condition: service_completed_successfully
    environment:
      HERMES_HOME: /opt/data
      # The dashboard is now the container's main program (see `command`),
      # so the supervised s6 dashboard service must NOT also start — two
      # dashboards would race for 9119.
      HERMES_DASHBOARD: "0"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USERNAME:?set in .env}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      # TencentDB Knowledge Plane: memory provider parity with the agent home.
      MEMORY_TENCENTDB_GATEWAY_HOST: tencentdb-core
      MEMORY_TENCENTDB_GATEWAY_PORT: "8420"
      MEMORY_TENCENTDB_GATEWAY_API_KEY: ${TENCENTDB_GATEWAY_API_KEY:-}
      MEMORY_TENCENTDB_TEAM_ID: opc
      PAPERCLIP_API_URL: http://paperclip:3100
      # Public board address, for building clickable ticket links in chat.
      # PAPERCLIP_API_URL is the internal name and is useless to a browser.
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - frontdoor-hermes:/opt/data
      # Read/observe the expert profiles the `hermes` gateway runs. Nested
      # under the frontdoor home on purpose: list_profiles() enumerates
      # $HERMES_HOME/profiles, so this is what puts the experts in the
      # dashboard's global profile switcher.
      - hermes-profiles:/opt/data/profiles
      - opc-nix:/nix
      - hermes-omp:/root/.omp
      - opc-keys:/keys:ro
      - opc-gh-creds:/creds
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9119/); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ] || [ \"$$code\" = \"302\" ]"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  # ══════════════════════════ Paperclip ══════════════════════════
  paperclip:
    build:
      context: ./upstream/paperclip
      dockerfile: opc/Dockerfile
      # Build-order edge for the nix seed — see buzz-keys above for why the
      # `depends_on` is not one.
      additional_contexts:
        nix-seed: "service:nix-seed"
      args:
        NIX_SEED_IMAGE: ${IMAGE_PREFIX:-opc}/nix-seed:local
    image: ${IMAGE_PREFIX:-opc}/paperclip:local
    init: true
    restart: unless-stopped
    depends_on:
      nix-daemon:
        condition: service_healthy
      nix-seed:
        condition: service_completed_successfully
      # GitHub credentials for the executor agent's dev flow (git push / gh
      # from the paperclip work plane — same rationale as frontdoor).
      host-sync:
        condition: service_completed_successfully
      # Claude Code credential for the prototyper agent's home (non-fatal:
      # the one-shot exits 0 even with no host login).
      host-sync-claude:
        condition: service_completed_successfully
      # devenv backends — the entrypoint applies the control schema at boot,
      # so they must already accept connections.
      devenv-pg:
        condition: service_healthy
      devenv-valkey:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}
      # Hostname allow-list for the private-hostname guard (comma-separated).
      # "paperclip" is required: hermes/frontdoor call it by docker DNS name
      # (loopback-only default would 403 every internal API call). Add the
      # host's LAN IP if you open the board from other devices.
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES:-paperclip}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-v4-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # devenv: admin credentials for the CLI + boot schema apply. Agents never
      # read these directly — they get scoped per-tenant URLs in their .env.
      DEVENV_PG_HOST: devenv-pg
      DEVENV_PG_PORT: "5432"
      DEVENV_PG_ADMIN_USER: postgres
      DEVENV_PG_ADMIN_PASSWORD: ${DEVENV_PG_PASSWORD:-devenv}
      DEVENV_VALKEY_HOST: devenv-valkey
      DEVENV_VALKEY_PORT: "6379"
      DEVENV_VALKEY_PASSWORD: ${DEVENV_VALKEY_PASSWORD:-devenv}
      DEVENV_VALKEY_DATABASES: "64"
      # Per-tenant passwords are derived from this, not stored — so provision
      # stays idempotent without keeping plaintext secrets in the registry.
      # Changing it invalidates every already-issued .env.
      DEVENV_SECRET_SALT: ${DEVENV_SECRET_SALT:-opc-devenv-default-salt}
      # devenv http provider: the preview-port pool for prototype dev servers.
      # BASE must stay below the kernel's ephemeral range (32768 by default) —
      # inside it, a bind(port 0) anywhere (including paperclip's own
      # allocatePort()) can be handed a leased port while its server is down.
      # opc-devenv-seed.sh re-checks this against the CONTAINER's actual range.
      DEVENV_HTTP_PORT_BASE: ${DEVENV_HTTP_PORT_BASE:-21000}
      DEVENV_HTTP_PORT_COUNT: ${DEVENV_HTTP_PORT_COUNT:-16}
      DEVENV_HTTP_PORT_RANGE_END: ${DEVENV_HTTP_PORT_RANGE_END:-21015}
      # Empty = derive from PAPERCLIP_PUBLIC_URL's host (see providers/http.sh),
      # so one setting governs both the board's address and the preview links
      # instead of the same hostname being written in two places that can
      # disagree. Set explicitly only to override that.
      DEVENV_HTTP_PUBLIC_HOST: ${DEVENV_HTTP_PUBLIC_HOST:-}
      # podenv: the nested container lease lane. It shares devenv's control
      # database (its own table), so it needs no extra credentials — only the
      # pool bounds, which must match this service's published range.
      PODENV_PORT_BASE: ${PODENV_PORT_BASE:-23000}
      PODENV_PORT_COUNT: ${PODENV_PORT_COUNT:-16}
      PODENV_PORT_RANGE_END: ${PODENV_PORT_RANGE_END:-23015}
      DEVENV_S3_HOST: devenv-s3
      DEVENV_S3_PORT: "9000"
      DEVENV_S3_ROOT_USER: ${DEVENV_S3_ROOT_USER:-devenv-admin}
      DEVENV_S3_ROOT_PASSWORD: ${DEVENV_S3_ROOT_PASSWORD:-devenv-object-storage}
    ports:
      - "${PAPERCLIP_PORT:-3100}:3100"
      # Preview ports for prototype dev servers, leased by `devenv provision
      # --with http`. Docker fixes published ports at container-create time, so
      # this range is static and resizing it requires recreating the container.
      #
      # RANGE_END duplicates BASE + COUNT - 1 because compose cannot do
      # arithmetic. opc-devenv-seed.sh verifies they agree at boot — this is
      # the easiest thing in the whole feature to change and get wrong.
      #
      # Published on every interface by default, like paperclip (3100), buzz
      # (3000), hermes (8642/9119) and tencentdb already are. A loopback-only
      # default was tried and is wrong here: the preview link lives ON the
      # board, so a preview unreachable from wherever the board is reachable is
      # broken by construction — and it would be the only thing narrower than
      # the board itself, which holds every ticket and config in the stack.
      #
      # Tighten it per deployment if you want: DEVENV_HTTP_BIND=127.0.0.1 for
      # local-only, or a tailnet address (Tailscale 100.x) to reach your own
      # devices without listening on the LAN. Whatever you choose,
      # DEVENV_HTTP_PUBLIC_HOST must resolve to it or DEV_URL advertises an
      # address the browser cannot reach.
      - "${DEVENV_HTTP_BIND:-0.0.0.0}:${DEVENV_HTTP_PORT_BASE:-21000}-${DEVENV_HTTP_PORT_RANGE_END:-21015}:${DEVENV_HTTP_PORT_BASE:-21000}-${DEVENV_HTTP_PORT_RANGE_END:-21015}"
    volumes:
      - paperclip-data:/paperclip
      - opc-nix:/nix
      - paperclip-mise:/opt/mise
      - opc-gh-creds:/creds
      # HOME for the prototyper agent (adapterConfig env.HOME). Holds only
      # .claude/.credentials.json + a minimal .claude.json; the agent's own
      # Claude state (sessions, projects) accumulates here and survives
      # re-syncs. Named by role, not engine — swapping claude→omp later
      # keeps the same home.
      - opc-prototyper-home:/agent-homes/prototyper
      # Prototype working trees. One directory per prototype, each its own git
      # repo. Paperclip does NOT create a local_path workspace's cwd (mkdir
      # only happens for worktrees), so the `prototype` CLI makes it.
      - opc-prototypes:/prototypes
      # podenv's API socket. A unix socket on a shared volume is reachable
      # across containers — the same mechanism nix-daemon uses. Mounted rw
      # because connecting to a unix socket requires write permission on it.
      #
      # There is deliberately NO depends_on edge to the podenv service: a
      # broken nested runtime must degrade to "leases fail when used", not to
      # "paperclip does not start" (invariant 8).
      - opc-podenv-sock:/run/podenv
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 90s

  # First-boot bootstrap: admin (default creds) + company + executor agent +
  # board API key (→ /keys/paperclip-api.key). Idempotent, one-shot.
  paperclip-bootstrap:
    image: ${IMAGE_PREFIX:-opc}/paperclip:local
    restart: "no"
    depends_on:
      paperclip:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/opc-paperclip-bootstrap.sh"]
    environment:
      PAPERCLIP_API_URL: http://paperclip:3100
      # Public board address, for building clickable ticket links in chat.
      # PAPERCLIP_API_URL is the internal name and is useless to a browser.
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}
      PAPERCLIP_ADMIN_EMAIL: ${PAPERCLIP_ADMIN_EMAIL:-admin@opc.local}
      PAPERCLIP_ADMIN_PASSWORD: ${PAPERCLIP_ADMIN_PASSWORD:?set in .env}
      PAPERCLIP_ADMIN_NAME: ${PAPERCLIP_ADMIN_NAME:-Admin}
      PAPERCLIP_COMPANY_NAME: ${PAPERCLIP_COMPANY_NAME:-OPC}
      PAPERCLIP_EXECUTOR_AGENT_NAME: ${PAPERCLIP_EXECUTOR_AGENT_NAME:-OMP Engineer}
      PAPERCLIP_SCIENTIST_AGENT_NAME: ${PAPERCLIP_SCIENTIST_AGENT_NAME:-Scientist}
      # Same value the hermes entrypoint seeds into the profile's own .env —
      # this is the credential paperclip presents on /p/agt-scientist.
      HERMES_SCIENTIST_API_KEY: ${HERMES_SCIENTIST_API_KEY:?set in .env}
      # Wall-clock cap on one Scientist run. Passed explicitly (rather than
      # left to the script's own default) because a knob documented in
      # SETUP.md that compose does not forward is a knob that silently does
      # nothing — the operator sets it in .env, sees no WARNING, and the value
      # never leaves the host. The reason for 1800 over the adapter's 600 is
      # in opc-paperclip-bootstrap.sh next to the assignment.
      HERMES_SCIENTIST_TIMEOUT_SEC: ${HERMES_SCIENTIST_TIMEOUT_SEC:-1800}
    volumes:
      - opc-keys:/keys
      # Write-side of the board-key mirror the `prototype` CLI reads when a
      # human runs it via docker exec (agent runs get PAPERCLIP_API_KEY
      # injected; interactive shells do not).
      - paperclip-data:/paperclip

  # Standing devenv lease for the expert agents. Runs in the paperclip image
  # because that is where the devenv CLI lives — deliberately not copied into
  # the hermes image: devenv is a generic resource-lease tool and should not
  # grow a second, drifting implementation. Output lands on the shared keys
  # volume; the hermes entrypoint folds it into the profile's .env.
  #
  # There is no automatic reclamation anywhere in this stack (invariant 6b);
  # release it by hand with `devenv release scientist` if the expert is retired.
  #
  # ALWAYS exits 0. `hermes` waits on this one-shot completing (it must, so a
  # clean setup.sh has the lease on disk before the profile .env is seeded),
  # which means any non-zero exit here would take the whole agent runtime down:
  # exhausted valkey slots (`devenv` exits 3), a rotated DEVENV_SECRET_SALT, or a
  # wrong admin password. That inverts the
  # stance this stack already took for the same subsystem in
  # patches/paperclip/opc-devenv-seed.sh — a devenv problem must surface when
  # the resource is USED, not as the runtime failing to start. So a failed
  # provision degrades the scientist's database access (no DATABASE_URL /
  # VALKEY_URL in its profile .env) and the three `── devenv lease ──` checks
  # in tests/scientist.sh are the detector for that state.
  #
  # This one-shot applies the devenv control schema ITSELF before it
  # provisions, by sourcing the same /usr/local/bin/opc-devenv-seed.sh the
  # paperclip entrypoint uses (same image, same idempotent SQL, no second
  # copy). That is a fix, not tidiness: the schema used to be created only by
  # paperclip's ENTRYPOINT, which reaches its devenv seed only AFTER the nix /
  # mise / gh / claude seeds — minutes on a clean machine's empty *-mise
  # volume (invariant 4). So on the open-box path this container ran first,
  # `devenv provision` found no schema, the one-shot exited 0 by design, and
  # the scientist booted with no DATABASE_URL/VALKEY_URL — permanently, since
  # compose does not re-run a one-shot whose container exited 0.
  #
  # Two alternatives were weighed and rejected:
  #   * `paperclip: service_healthy` — it would order correctly (the seed runs
  #     before the exec, so health implies the schema), but it makes the
  #     gateway wait for the BOARD's full boot, and worse, a paperclip that is
  #     unhealthy for an unrelated reason means this one-shot never runs at
  #     all and `hermes` (which waits on it with
  #     service_completed_successfully) never starts. That is a STRONGER
  #     version of the coupling the exit-0 behaviour deliberately removed.
  #   * retry-until-the-schema-appears with a bounded timeout — correct, but
  #     it parks the gateway's start behind another container's slowest boot
  #     for minutes, and still degrades on the pathological case.
  # Applying the schema here costs one psql round trip and depends on nothing
  # but devenv-pg, which this service already waits for.
  #
  # `paperclip: service_started`, not service_healthy: the edge is kept only
  # so `docker compose up devenv-expert-leases` on its own is guaranteed to
  # have the paperclip image built. Nothing here waits on the board being
  # ready, and nothing here depends on paperclip's entrypoint any more.
  devenv-expert-leases:
    image: ${IMAGE_PREFIX:-opc}/paperclip:local
    restart: "no"
    depends_on:
      devenv-pg:
        condition: service_healthy
      devenv-valkey:
        condition: service_healthy
      paperclip:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # Output is captured, not streamed: `devenv provision` prints the
        # tenant DATABASE_URL/VALKEY_URL, passwords and all, and
        # `docker compose logs` keeps them for the life of the container.
        # The lease belongs in the 600 file, nowhere else.
        #
        # Create the control database + devenv_tenant schema first: `devenv`
        # never creates it (patches/paperclip/devenv/devenv), and waiting for
        # paperclip's entrypoint to get there is the race described above.
        # Idempotent and never fatal — see opc-devenv-seed.sh.
        . /usr/local/bin/opc-devenv-seed.sh
        opc_devenv_seed_schema || true
        _rc=0
        _out="$$(devenv provision scientist --env-file /keys/devenv-scientist.env 2>&1)" || _rc=$$?
        if [ "$$_rc" -eq 0 ]; then
            chmod 600 /keys/devenv-scientist.env \
                || echo "[devenv-expert-leases] WARNING: could not chmod 600 the lease file" >&2
            echo "[devenv-expert-leases] scientist lease written -> /keys/devenv-scientist.env"
        else
            echo "[devenv-expert-leases] WARNING: devenv provision scientist failed (exit $$_rc)." >&2
            echo "[devenv-expert-leases] WARNING: the scientist keeps whatever lease it already had; a first" >&2
            echo "[devenv-expert-leases] WARNING: boot leaves it with no DATABASE_URL/VALKEY_URL." >&2
            # Name the cause instead of letting the reader inherit whichever
            # message the provisioner happened to reach first. The schema is
            # applied a few lines above, so a failure here is NOT the old
            # "control schema missing" race (which surfaced as devenv's
            # `no free valkey database id … release one` — an exhaustion
            # message for a missing table). Exit 3 now really is exhaustion,
            # exit 4 really is an unreachable/unusable backend.
            case "$$_rc" in
              3) echo "[devenv-expert-leases] WARNING: exit 3 = a resource pool is genuinely exhausted (valkey db ids" >&2
                 echo "[devenv-expert-leases] WARNING: or preview ports). Run 'docker compose exec paperclip devenv list'" >&2
                 echo "[devenv-expert-leases] WARNING: and release a lease." >&2 ;;
              4) echo "[devenv-expert-leases] WARNING: exit 4 = devenv-pg/devenv-valkey unreachable, the admin credential is" >&2
                 echo "[devenv-expert-leases] WARNING: wrong, or the devenv_control schema could not be created (the" >&2
                 echo "[devenv-expert-leases] WARNING: [devenv-seed] lines above this one say which)." >&2 ;;
              *) echo "[devenv-expert-leases] WARNING: see the provisioner output below for the cause." >&2 ;;
            esac
            echo "[devenv-expert-leases] WARNING: Detector: 'tests/scientist.sh' (the devenv lease block)." >&2
            echo "[devenv-expert-leases] WARNING: Retry with 'docker compose up devenv-expert-leases' (idempotent)." >&2
            echo "[devenv-expert-leases] WARNING: Provisioner output:" >&2
            # Redact rather than drop: an error can legitimately quote a URL,
            # and the password is the only part that must not be logged.
            printf '%s\n' "$$_out" | sed 's#\(://[^:/@]*\):[^@]*@#\1:***@#g; s/^/[devenv-expert-leases]   /' >&2
        fi
        exit 0
    environment:
      DEVENV_OWNER: scientist
      # Same admin-connection env the paperclip service uses (line ~625
      # below) — compose does not let one service inherit another's
      # `environment:` block, so the devenv CLI needs its own copy of every
      # variable it reads to reach devenv-pg/devenv-valkey and to re-derive
      # the per-tenant password from DEVENV_SECRET_SALT.
      DEVENV_PG_HOST: devenv-pg
      DEVENV_PG_PORT: "5432"
      DEVENV_PG_ADMIN_USER: postgres
      DEVENV_PG_ADMIN_PASSWORD: ${DEVENV_PG_PASSWORD:-devenv}
      DEVENV_VALKEY_HOST: devenv-valkey
      DEVENV_VALKEY_PORT: "6379"
      DEVENV_VALKEY_PASSWORD: ${DEVENV_VALKEY_PASSWORD:-devenv}
      DEVENV_VALKEY_DATABASES: "64"
      DEVENV_SECRET_SALT: ${DEVENV_SECRET_SALT:-opc-devenv-default-salt}
    volumes:
      - opc-keys:/keys

  # ══════════════════════════ devenv (agent 開發資源) ══════════════════════════
  # Shared backends that Paperclip agents lease per-tenant via the `devenv` CLI
  # (baked into the paperclip image). Chosen over giving agents docker: no host
  # mount, no privileged, no nested runtime — see
  # docs/superpowers/specs/2026-08-18-devenv-resource-provisioning-design.md.
  #
  # Host ports bind 127.0.0.1 only: the point is that YOU can point a SQL client
  # at a prototype's data, not that the LAN can.
  #
  # Every credential here has a working default — this lane must come up on a
  # fresh clone with no .env edits. They are weak on purpose: loopback-only
  # scratch backends for throwaway data. Override in .env if you ever put
  # something you would miss in here.
  devenv-pg:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DEVENV_PG_PASSWORD:-devenv}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${DEVENV_PG_PORT:-5433}:5432"
    volumes:
      # pg18+ wants the mount one level up (data lands in a subdirectory) so
      # `pg_upgrade --link` isn't blocked by a mount-point boundary. Mounting
      # /var/lib/postgresql/data as on pg17 makes the image refuse to start.
      - devenv-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # --databases 64 → tenant ids 1..63 (0 reserved for devenv itself). The
  # `db=<dbid>` ACL op that makes those ids a real isolation boundary landed in
  # valkey 9.1.0; 9.0.x does not have it, so this tag is a floor, not a taste.
  devenv-valkey:
    image: valkey/valkey:9.1.1-alpine
    restart: unless-stopped
    command:
      - "valkey-server"
      - "--databases"
      - "64"
      - "--requirepass"
      - "${DEVENV_VALKEY_PASSWORD:-devenv}"
      - "--appendonly"
      - "yes"
    ports:
      - "127.0.0.1:${DEVENV_VALKEY_PORT:-6380}:6379"
    volumes:
      - devenv-valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$DEVENV_VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      DEVENV_VALKEY_PASSWORD: ${DEVENV_VALKEY_PASSWORD:-devenv}

  devenv-s3:
    image: rustfs/rustfs:1.0.0-rc.3@sha256:800cf3f352a0a27e3275ca854a51f0027975d7acc7a0d52089a35bcc9fcbf0b5
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${DEVENV_S3_ROOT_USER:-devenv-admin}
      RUSTFS_SECRET_KEY: ${DEVENV_S3_ROOT_PASSWORD:-devenv-object-storage}
    ports:
      - "127.0.0.1:${DEVENV_S3_PORT:-9002}:9000"
    volumes:
      - devenv-s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
  # ══════════════════════ podenv (巢狀容器租約) ══════════════════════
  # devenv 蓋不到的那一半: 不能 multi-tenant 的 daemon, 以及很老舊的版本。
  # 設計 (含七條量測): docs/superpowers/specs/
  # 2026-08-22-podenv-nested-container-lease-design.md
  #
  # Rootless podman inside docker. Invariant 6's two prohibitions both hold:
  # no host mount, no privileged. The three declarations below are the ENTIRE
  # security posture of this lane and each one is a measured necessity:
  #
  #   seccomp=unconfined  docker's default profile blocks clone() with
  #                       CLONE_NEWUSER, so rootless podman cannot start at
  #                       all. Measured both ways: with it, nested `podman
  #                       run` works; without it, "cannot clone: Operation not
  #                       permitted". It relaxes the syscall filter and grants
  #                       NOTHING on the host filesystem — far smaller than
  #                       privileged, which is what DinD needs (even the
  #                       official dind-rootless image documents --privileged).
  #                       It is confined to THIS service on purpose: paperclip
  #                       holds /keys, gh creds, the board API key and every
  #                       prototype. This container is NOT empty (final
  #                       review F4 corrects an earlier, false claim here) —
  #                       it mounts opc-prototypes read-write too (below), so
  #                       it can list every prototype's tree and read each
  #                       one's .env (DATABASE_URL, VALKEY_URL,
  #                       BETTER_AUTH_SECRET, DEVENV_KEY included). The blast
  #                       radius really is smaller than paperclip's — no
  #                       /keys, no gh/claude creds, no hermes home, pinned by
  #                       tests/podenv.sh's "mounts no secret volume" check —
  #                       but "holds nothing" overstated it for anyone judging
  #                       whether seccomp=unconfined is acceptable here. What
  #                       this container actually holds is every prototype's
  #                       tree and its devenv credentials, which the agent
  #                       already has, and no stack credentials.
  #   /dev/net/tun        pasta needs it to create its tap device. Without it
  #                       nested containers fall back to the sidecar's netns
  #                       and `-p` is discarded WITHOUT A WARNING. bridge /
  #                       netavark is not an option at all: it writes
  #                       /proc/sys, which docker mounts read-only.
  #   mem_limit           The ONLY memory knob that works. Per-lease
  #                       --memory is silently ignored (measured: memory.max
  #                       stays `max`, no warning) and cannot be fixed without
  #                       mounting the host's /sys/fs/cgroup.
  #
  # NOT needed here, measured on this host — do not "helpfully" add them:
  # apparmor=unconfined (AppArmor is not loaded), label=disable (no SELinux),
  # /dev/fuse (kernel 7.2 gives native rootless overlay).
  podenv:
    build:
      context: ./patches/podenv
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-opc}/podenv:local
    # podman itself is PID 1 and never wait()s on reparented children — every
    # nested `podman run`/`podman build` leaves a (pasta.avx2) and a (conmon)
    # zombie behind (measured: 5 nested runs -> 10 zombies, ppid 1). init:
    # true swaps in docker-init as PID 1, which reaps them and still forwards
    # signals through to podman on `compose stop`. Same precedent as
    # buzz/frontdoor/paperclip above.
    init: true
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    devices:
      - /dev/net/tun
    mem_limit: ${PODENV_MEM_LIMIT:-4g}
    environment:
      # Must equal paperclip's `node` uid: the socket stays 0600 and its owner
      # IS the access gate. Asserted at build time in the Dockerfile and by
      # tests/podenv.sh against the running paperclip.
      PODENV_UID: "1000"
      PODENV_GID: "1000"
      PODENV_SOCK_DIR: /run/podenv
    # Published for the OPERATOR only (127.0.0.1), same stance as devenv-pg:
    # the point is that YOU can point a client at a leased daemon, not that
    # the LAN can. In-stack consumers do not need this at all — they reach a
    # lease at podenv:<port> over docker DNS.
    #
    # BASE and RANGE_END are stated twice (here and in the CLI's pool)
    # because compose cannot do arithmetic; opc-podenv-seed.sh (paperclip's
    # entrypoint) warns when they drift, and tests/podenv.sh fails on it too.
    ports:
      - "127.0.0.1:${PODENV_PORT_BASE:-23000}-${PODENV_PORT_RANGE_END:-23015}:${PODENV_PORT_BASE:-23000}-${PODENV_PORT_RANGE_END:-23015}"
    volumes:
      - opc-podenv-sock:/run/podenv
      - opc-podenv-store:/home/podman/.local/share/containers
      # Lets a lease bind-mount the project it belongs to. No new exposure:
      # the agent already reads this whole tree from paperclip.
      - opc-prototypes:/prototypes
    healthcheck:
      # `test -S` only proves the socket FILE exists, not that anything is
      # listening — measured: a stale socket from a previous run (or one
      # created by anything else) still passes `test -S` with nobody home.
      # Prove the API actually answers instead, as the uid that will use it.
      test: ["CMD-SHELL", "setpriv --reuid 1000 --regid 1000 --clear-groups --inh-caps=-all env HOME=/home/podman XDG_RUNTIME_DIR=/run/user/1000 podman --remote --url unix:///run/podenv/podman.sock version >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ══════════════════════════ TencentDB-Agent-Memory ══════════════════════════
  tencentdb-core:
    build:
      context: ./upstream/tencentdb-agent-memory/MemoryCore
      dockerfile: opc/Dockerfile
    image: ${IMAGE_PREFIX:-opc}/tencentdb-core:local
    restart: unless-stopped
    environment:
      TDAI_GATEWAY_HOST: 0.0.0.0
      TDAI_GATEWAY_PORT: "8420"
      TDAI_GATEWAY_API_KEY: ${TENCENTDB_GATEWAY_API_KEY:-}
      TDAI_DATA_DIR: /data/tdai-memory
      TDAI_SKILL_ENABLED: "true"
      TDAI_LLM_API_KEY: ${OPENAI_API_KEY:-${TENCENTDB_LLM_API_KEY:-}}
      TDAI_LLM_BASE_URL: ${TENCENTDB_LLM_BASE_URL:-${OPENAI_BASE_URL:-https://opencode.ai/zen/go/v1}}
      TDAI_LLM_MODEL: ${TENCENTDB_LLM_MODEL:-${OPENAI_MODEL:-deepseek-v4-flash}}
    ports:
      - "${TENCENTDB_CORE_PORT:-8420}:8420"
    volumes:
      - tencentdb-core-data:/data/tdai-memory

  # First-boot admin: POST /v3/internal/meta/user/init-admin (idempotent),
  # then meta-plane provisioning (team "opc" + agent "agt-hermes-front-door" —
  # the tenancy ids the hermes memory_tencentdb plugin writes under; without
  # them the Memory Hub panel at 8125 stays empty even though L0-L3 data
  # accumulates).
  tencentdb-bootstrap:
    image: ${IMAGE_PREFIX:-opc}/tencentdb-core:local
    restart: "no"
    depends_on:
      tencentdb-core:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for i in $$(seq 1 60); do
          curl -fsS http://tencentdb-core:8420/health >/dev/null 2>&1 && break
          sleep 2
        done
        code=$$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
          http://tencentdb-core:8420/v3/internal/meta/user/init-admin \
          -H 'Content-Type: application/json' \
          -H 'x-tdai-service-id: default' \
          -H "Authorization: Bearer $${TENCENTDB_GATEWAY_API_KEY:-}" \
          -d "{\"username\":\"$${TENCENTDB_ADMIN_USERNAME:-admin}\",\"user_key\":\"$${TENCENTDB_ADMIN_USER_KEY}\"}")
        echo "tencentdb init-admin -> HTTP $$code"
        [ "$$code" = "200" ] || [ "$$code" = "409" ]
        exec /usr/local/bin/opc-tencentdb-provision.sh
    environment:
      TENCENTDB_ADMIN_USERNAME: ${TENCENTDB_ADMIN_USERNAME:-admin}
      TENCENTDB_ADMIN_USER_KEY: ${TENCENTDB_ADMIN_USER_KEY:?set in .env}
      TENCENTDB_GATEWAY_API_KEY: ${TENCENTDB_GATEWAY_API_KEY:-}
      TENCENTDB_GATEWAY_URL: http://tencentdb-core:8420
      TENCENTDB_TEAM_ID: ${TENCENTDB_TEAM_ID:-opc}
      TENCENTDB_TEAM_NAME: ${TENCENTDB_TEAM_NAME:-OPC}
      TENCENTDB_AGENT_ID: ${TENCENTDB_AGENT_ID:-agt-hermes-front-door}
      TENCENTDB_AGENT_NAME: ${TENCENTDB_AGENT_NAME:-Hermes Front Door}
      # COMMA-separated `agt-<id>:<Display Name>` pairs — names contain
      # spaces (cf. TENCENTDB_AGENT_NAME above), so whitespace cannot be the
      # separator. The provisioner refuses an entry with no ':' and an id
      # without the `agt` prefix (the Memory Hub panel parses
      # chat_memory-{team}-{agent} with lastIndexOf('-agt')).
      TENCENTDB_EXTRA_AGENTS: ${TENCENTDB_EXTRA_AGENTS:-agt-scientist:Scientist}
    volumes:
      - opc-keys:/keys

  tencentdb-hub:
    build:
      context: ./upstream/tencentdb-agent-memory
      dockerfile: opc/hub.Dockerfile
    image: ${IMAGE_PREFIX:-opc}/tencentdb-hub:local
    restart: unless-stopped
    depends_on:
      tencentdb-core:
        condition: service_healthy
    environment:
      PANEL_PORT: "8125"
      KNOWLEDGE_PORT: "8424"
      REMOTE_INSTANCE_ID: default
      REMOTE_INSTANCE_NAME: local
      REMOTE_INSTANCE_URL: http://tencentdb-core:8420
      REMOTE_INSTANCE_KEY: ${TENCENTDB_GATEWAY_API_KEY:-}
      KNOWLEDGE_PUBLIC_BASE_URL: ${TENCENTDB_KNOWLEDGE_PUBLIC_URL:-http://localhost:8424/v3}
      LLM_MODE: custom
      LLM_PROTOCOL: openai
      LLM_API_KEY: ${OPENAI_API_KEY:-${TENCENTDB_LLM_API_KEY:-}}
      LLM_BASE_URL: ${TENCENTDB_LLM_BASE_URL:-${OPENAI_BASE_URL:-https://opencode.ai/zen/go/v1}}
      LLM_MODEL: ${TENCENTDB_LLM_MODEL:-${OPENAI_MODEL:-deepseek-v4-flash}}
    ports:
      - "${TENCENTDB_PANEL_PORT:-8125}:8125"
      - "${TENCENTDB_KNOWLEDGE_PORT:-8424}:8424"
    volumes:
      - tencentdb-hub-data:/data/knowledge

  tencentdb-proxy:
    build:
      context: ./upstream/tencentdb-agent-memory/MemoryProxy
      dockerfile: opc/proxy.Dockerfile
    image: ${IMAGE_PREFIX:-opc}/tencentdb-proxy:local
    restart: unless-stopped
    depends_on:
      tencentdb-core:
        condition: service_healthy
      tencentdb-hub:
        condition: service_started
    environment:
      PROXY_UPSTREAM_URL: ${PROXY_UPSTREAM_URL:-${OPENAI_BASE_URL:-https://opencode.ai/zen/go/v1}}
      PROXY_UPSTREAM_API_KEY: ${PROXY_UPSTREAM_API_KEY:-${OPENAI_API_KEY:-}}
      PROXY_TDAI_ENDPOINT: http://tencentdb-core:8420
      PROXY_TDAI_API_KEY: ${TENCENTDB_GATEWAY_API_KEY:-}
      PROXY_KNOWLEDGE_ENDPOINT: http://tencentdb-hub:8424
      PROXY_KNOWLEDGE_TOKEN: ""
    ports:
      - "${TENCENTDB_PROXY_PORT:-8096}:8096"
    volumes:
      - tencentdb-proxy-data:/data

volumes:
  opc-keys:
  # Single shared nix store + daemon socket + shared agent profile.
  # Replaced the per-service buzz/frontdoor/hermes/paperclip -nix volumes so a
  # tool installed in one container is present in all of them.
  opc-nix:
  opc-gh-creds:
  opc-prototypes:
  # podenv: the API socket (shared with paperclip — a unix socket on a shared
  # volume is reachable across containers, the same mechanism nix-daemon uses)
  # and the image/container store.
  opc-podenv-sock:
  opc-podenv-store:
  opc-prototyper-home:
  devenv-pg-data:
  devenv-valkey-data:
  devenv-s3-data:
  buzz-pgdata:
  buzz-redisdata:
  buzz-miniodata:
  buzz-git:
  frontdoor-hermes:
  hermes-data:
  # Expert agent profiles (scientist, and future market-research etc.).
  # Deliberately NOT frontdoor-hermes: that volume's root holds the chief of
  # staff's .agent.nsec (600 uid 10000) and the experts run as the same uid,
  # while hermes's cross-profile guard does not cover the terminal tool
  # (agent/file_safety.py:427). Mounting it whole would hand every expert the
  # chief of staff's Buzz identity. Mounted at /opt/data/profiles in the
  # gateway (which runs them) and in the dashboard (which observes them) —
  # `hermes profile list` enumerates $HERMES_HOME/profiles, so one dashboard
  # login covers default (chief of staff) plus every expert.
  hermes-profiles:
  paperclip-data:
  buzz-mise:
  frontdoor-mise:
  hermes-mise:
  paperclip-mise:
  buzz-omp:
  frontdoor-omp:
  hermes-omp:
  tencentdb-core-data:
  tencentdb-hub-data:
  tencentdb-proxy-data:
